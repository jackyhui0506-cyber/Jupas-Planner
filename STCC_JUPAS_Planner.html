<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STCC JUPAS Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Layout: STCC website shell — navy crest header, lavender-navy title band, breadcrumb bar, grey page with white cards (filter rail + results stack on phones) */
:root{
  --navy:#2e3462; --navy-2:#3e4471; --lav:#8a7ca6; --gold:#e3c56a; --crest-red:#b83a32;
  --bg:#ededed; --surface:#ffffff; --surface-2:#f6f5f9; --fg:#262a47; --muted:#6b6d82; --line:#dcdbe5;
  --accent:#d29052; --accent-soft:#f6e6d6; --accent-ink:#a8622a;
  --brand:#2e3462; --brand-soft:#e5e2ef; --brand-ink:#2e3462;
  --on-brand:#ffffff; --on-brand-muted:#c9c6dc; --btn-ink:#ffffff;
  --safe:#2f7d4f; --safe-bg:#e1f1e6; --marg:#946400; --marg-bg:#f9edcc; --risk:#b3372e; --risk-bg:#f8e0dc;
  --none:#5f6b7a; --none-bg:#e6e9ee;
  --f-body:"Noto Sans HK","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Playfair Display","Noto Serif HK",Georgia,serif;
  --f-crest:"Cinzel","Playfair Display",Georgia,serif;
  --f-zh-serif:"Noto Serif HK","PMingLiU",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14162b; --surface:#1d2040; --surface-2:#252950; --fg:#eceaf6; --muted:#a9a8c4; --line:#343869;
  --accent:#e9a86c; --accent-soft:#3e2e24; --accent-ink:#f3c08f;
  --brand:#aeb4ea; --brand-soft:#2c3163; --brand-ink:#d5d8f8; --btn-ink:#14162b;
  --safe:#7fd3a0; --safe-bg:#1d3a2a; --marg:#f0c565; --marg-bg:#3b3116; --risk:#f39a8f; --risk-bg:#45211d;
  --none:#aab6c4; --none-bg:#2a2f45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14162b; --surface:#1d2040; --surface-2:#252950; --fg:#eceaf6; --muted:#a9a8c4; --line:#343869;
  --accent:#e9a86c; --accent-soft:#3e2e24; --accent-ink:#f3c08f;
  --brand:#aeb4ea; --brand-soft:#2c3163; --brand-ink:#d5d8f8; --btn-ink:#14162b;
  --safe:#7fd3a0; --safe-bg:#1d3a2a; --marg:#f0c565; --marg-bg:#3b3116; --risk:#f39a8f; --risk-bg:#45211d;
  --none:#aab6c4; --none-bg:#2a2f45; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 0 var(--accent)}
header.top .wrap{display:flex;align-items:center;gap:16px 28px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.crest{width:56px;height:56px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.brand .en{font-family:var(--f-crest);font-weight:700;color:var(--gold);font-size:20px;letter-spacing:.04em;line-height:1.1;margin:0}
.brand .zh{font-family:var(--f-zh-serif);color:var(--on-brand);font-size:13.5px;letter-spacing:.42em;margin:2px 0 0;font-weight:600}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--on-brand);padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--gold)}
nav.tabs button[aria-selected="true"]{color:var(--gold);border-bottom-color:var(--accent);font-weight:700}
.titleband{background:linear-gradient(105deg,var(--lav) 0%,#7a6d9c 38%,var(--navy-2) 100%);color:#fff;position:relative;overflow:hidden}
.titleband::after{content:"";position:absolute;right:-6%;top:-40%;width:46%;height:180%;background:rgba(255,255,255,.06);transform:skewX(-24deg)}
.titleband .wrap{padding-block:26px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.titleband h2{margin:0;font-family:var(--f-display);font-size:clamp(26px,4vw,40px);font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:16px;text-transform:uppercase}
.titleband h2::before{content:"";width:56px;height:2px;background:#fff;flex:none}
.titleband p{margin:0;font-size:14px;color:#eeeaf8}
.crumbs{background:var(--surface);border-bottom:1px solid var(--line)}
.crumbs .wrap{padding-block:12px;font-size:14px;color:var(--fg);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumbs span.sep{color:var(--muted)}
.crumbs b{font-weight:500;color:var(--accent-ink)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2.section-h,.res-head h2,.side h3,.route h3,.filters h3{color:var(--brand-ink)}
.res-head h2,h2.section-h{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.count-pill{font-family:var(--f-mono);font-size:12px;background:var(--accent);color:#1f1a14;border-radius:999px;padding:0 7px;margin-left:4px}

main{padding-block:18px 48px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.grades{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.grades .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px 12px;min-width:0}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:span 2}
.fld label{font-size:12.5px;color:var(--muted)}
select,input[type=text],input[type=search]{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:7px 10px;width:100%;min-width:0}
select:hover,input:hover{border-color:var(--accent)}
.elec{display:flex;gap:6px}
.elec select:first-child{flex:1.6}.elec select:last-child{flex:1}
.summary{text-align:right;display:flex;flex-direction:column;gap:8px;min-width:0;width:300px}
.summary .b5{font-size:13px;color:var(--muted)}
.summary .b5 b{font-family:var(--f-mono);font-size:26px;color:var(--fg);display:block;line-height:1.1}
.tiers{display:grid;gap:2px}
.tier{font-size:13px;display:grid;grid-template-columns:16px 96px 1fr;gap:6px;align-items:center;text-align:left;padding:2px 8px;border-radius:6px}
.tier.mine{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.tier .ok{color:var(--safe);font-weight:700}.tier .no{color:var(--muted)}
.tier code{font-family:var(--f-mono);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:4px 2px}
.stats span{display:block;font-size:11.5px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-size:17px}
.b5s{font-size:12px;color:var(--muted)}
.req{font-size:13px;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.req .ok{color:var(--safe);font-weight:700}.req .no{color:var(--risk);font-weight:700}
.req code{font-family:var(--f-mono);font-size:12.5px}
.sample{grid-column:1/-1;background:var(--marg-bg);color:var(--fg);border-radius:3px;padding:8px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;cursor:pointer;border-radius:3px;padding:8px 14px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand-ink);white-space:nowrap}
.btn:hover{background:var(--brand-soft)}
.btn.solid{background:var(--brand);border-color:var(--brand);color:var(--btn-ink)}
.btn.solid:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:3px}
.btn.ghost{border-color:var(--line);color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.explore{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.filters{padding:16px;display:grid;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.filters h3{font-size:14px;margin:0 0 6px}
.checks{display:grid;gap:4px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14.5px;cursor:pointer}
.checks input{accent-color:var(--brand);width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--btn-ink);font-weight:500}
.results{display:grid;gap:12px;min-width:0}
.res-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.res-head h2{margin:0;font-size:21px}
.res-head span{color:var(--muted);font-size:13.5px}
.prog{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) 300px auto;gap:18px;align-items:center}
.prog .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:13px;color:var(--brand-ink);font-weight:600}
.inst{font-weight:700;font-size:14.5px}
.badge{font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.b-safe{background:var(--safe-bg);color:var(--safe)}.b-marginal{background:var(--marg-bg);color:var(--marg)}
.b-risky{background:var(--risk-bg);color:var(--risk)}.b-nodata,.b-inel{background:var(--none-bg);color:var(--none)}
.tag{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}
.prog h4{margin:6px 0 4px;font-size:16.5px;font-weight:700;color:var(--brand-ink);text-wrap:balance}
.prog .fx{font-size:13px;color:var(--muted);margin:0}
.prog .note{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.warn{color:var(--risk);font-size:12.5px;margin:4px 0 0}
.gauge{display:grid;gap:6px;font-size:13px}
.gauge .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gauge .top b{font-family:var(--f-mono)}
.gauge .lab{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
.track{position:relative;height:12px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.band{position:absolute;top:1px;bottom:1px;background:var(--brand-soft);border-radius:4px;min-width:4px}
.uq{position:absolute;top:1px;bottom:1px;width:2px;background:var(--brand);opacity:.6}
.pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--accent);transform:translateX(-2px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details.break{grid-column:1/-1;font-size:13px;color:var(--muted)}
details.break summary{cursor:pointer;width:max-content}
.used{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.used span{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-size:12px;color:var(--fg)}
.more{justify-self:center}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* choices */
.choices{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.bandgrp{padding:6px 0}
.bandhd{display:flex;align-items:baseline;gap:10px;padding:10px 18px 6px;border-top:1px solid var(--line)}
.bandgrp:first-child .bandhd{border-top:0}
.bandhd b{font-size:15px}.bandhd span{color:var(--muted);font-size:13px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:8px 18px}
.row:hover{background:var(--surface-2)}
.row .no{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.row .t{min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.row .sc{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
.row .ops{display:flex;gap:4px}
.icon{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:3px;width:30px;height:30px;cursor:pointer;font-size:14px;line-height:1}
.icon:hover{border-color:var(--accent);color:var(--accent-ink)}
.row.slot{color:var(--muted);font-size:14px}
.side{padding:16px;display:grid;gap:14px}
.side h3{margin:0;font-size:15px}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.dist div{border-radius:3px;padding:8px 4px;font-size:12px}
.dist b{display:block;font-family:var(--f-mono);font-size:20px}
.guide{border-bottom:1px solid var(--line);background:var(--surface-2)}
.guide summary{cursor:pointer;padding:12px 18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--brand-ink)}
.guide summary span{font-size:13px;color:var(--muted)}
.guide .gbody{padding:0 18px 16px;display:grid;gap:10px;font-size:14px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:4px}
.guide p{margin:0}
.gstat b{font-family:var(--f-mono);font-size:18px;color:var(--accent-ink)}
.gsrc{font-size:12.5px;color:var(--muted)}
.adv{margin:3px 0 0;font-size:12.5px;white-space:normal}
.adv-ok{color:var(--safe)}.adv-warn{color:var(--marg)}.adv-bad{color:var(--risk)}
.row .t .adv{white-space:normal}
.role{color:var(--accent-ink)}
.tips{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:6px}
.tips li.hit{color:var(--risk)}

/* routes / about */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.route{padding:16px 18px;display:grid;gap:8px;align-content:start}
.route h3{margin:0;font-size:16.5px}
.route .rq{display:flex;gap:8px;align-items:center;font-size:13.5px}
.route p,.route li{font-size:14px;margin:0}
.route ul{margin:0;padding-left:18px;display:grid;gap:4px}
.status{font-size:12.5px;padding:2px 9px;border-radius:999px;font-weight:700}
.st-ok{background:var(--safe-bg);color:var(--safe)}.st-no{background:var(--risk-bg);color:var(--risk)}
.section-h{margin:6px 0 0;font-size:19px}
.lede{color:var(--muted);margin:0;max-width:72ch}
table.tl{border-collapse:collapse;width:100%;font-size:14px}
table.tl td,table.tl th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tl th{font-size:12.5px;color:var(--muted);font-weight:500}
.scroll{overflow-x:auto}
.inst-list{display:flex;flex-wrap:wrap;gap:6px}
.inst-list a,.inst-list span{font-size:13.5px;border:1px solid var(--line);border-radius:3px;padding:4px 10px;color:var(--fg);text-decoration:none;background:var(--surface)}
.inst-list a:hover{border-color:var(--accent);color:var(--accent-ink)}
a{color:var(--accent-ink)}
.prose{padding:18px 20px;display:grid;gap:10px;max-width:none}
.prose p,.prose li{font-size:14.5px;max-width:78ch;margin:0}
.prose ul{margin:0;padding-left:20px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:4px;font-size:14px;z-index:20}
.filter-toggle{display:none}
.summary .compact{display:none;font-family:var(--f-mono);font-size:13px}
.summary #gtoggle{justify-self:end;align-self:flex-end}
.grades.collapsed .fields,.grades.collapsed .sample{display:none}
.grades.collapsed{grid-template-columns:1fr}
.grades.collapsed .summary{flex-direction:row;flex-wrap:wrap;align-items:center;text-align:left;gap:8px 16px}
.grades.collapsed .summary .compact{display:block;margin-right:auto}
.grades.collapsed .summary .tiers,.grades.collapsed .summary .b5s{display:none}
.grades.collapsed .summary{width:auto}
.grades.collapsed .summary .b5 b{display:inline;font-size:18px;margin-left:6px}
nav.tabs button{white-space:nowrap}
@media (max-width:980px){
  .prog{grid-template-columns:minmax(0,1fr) auto}
  .prog .gauge{grid-column:1/-1;grid-row:2}
  .choices{grid-template-columns:1fr}
}
@media (max-width:760px){
  .explore{grid-template-columns:1fr}
  .filters{position:static}
  .filter-toggle{display:inline-block}
  .filters.collapsed .fbody{display:none}
  .grades{grid-template-columns:1fr}
  .summary{text-align:left;width:auto}
  .req{justify-content:flex-start}
  .fld.wide{grid-column:1/-1}
  .prog{grid-template-columns:1fr}
  .prog .gauge{grid-row:auto}
  .row{grid-template-columns:28px minmax(0,1fr) auto}
  .row .sc{display:none}
  nav.tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}
  header.top{position:static}
  .brand .en{font-size:15px}.brand .zh{font-size:11.5px;letter-spacing:.2em}.crest{width:44px;height:44px}
  .titleband .wrap{padding-block:18px 14px}
  .summary #gtoggle{align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body><header class="top">

  if (p.noM) pool = pool.filter(x => !isM(x.s));
  const inc = p.inc || [];
  const missing = inc.filter(r => !pool.some(x => key(x.s) === r || x.s === r));
  for (const g of p.one || []) {
    const cnt = pool.filter(x => has(g.s, x.s)).length;
    if (cnt < g.k) missing.push(g.s.map(s => SHORT[s] || s).join("/") + (g.k > 1 ? ` ×${g.k}` : ""));
  }
  if (missing.length) return { score: null, missing };
  const n = Math.min(p.n || 5, pool.length);
  let best = null;
  for (const c of combos(pool, n)) {
    if (!inc.every(r => c.some(x => key(x.s) === r))) continue;
    if ((p.one || []).some(g => c.filter(x => has(g.s, x.s)).length < g.k)) continue;
    if (p.xm && c.some(x => x.s === "MATH") && c.some(x => isM(x.s))) continue;
    const items = c.map(x => {
      const b = wOf(p.w, x.s);
      return { s: x.s, g: x.g, pts: sc[x.g], w: b === undefined ? d : b, capped: false };
    });
    for (const cap of p.caps || []) {
      const cand = items.filter(it => !it.capped && wOf(cap.w, it.s) !== undefined && wOf(cap.w, it.s) > it.w)
        .sort((a, b) => b.pts * (wOf(cap.w, b.s) - b.w) - a.pts * (wOf(cap.w, a.s) - a.w));
      cand.slice(0, cap.max).forEach(it => { it.w = wOf(cap.w, it.s); it.capped = true; });
    }
    const limit = (max, filt) => {
      const heavy = items.filter(it => it.w > d && filt(it)).sort((a, b) => b.pts * (b.w - d) - a.pts * (a.w - d));
      heavy.slice(max).forEach(it => { it.w = d; });
    };
    if (p.maxW) limit(p.maxW, () => true);
    if (p.maxWE) limit(p.maxWE, it => !CORE.includes(it.s));
    if (p.medM && mBest > 0) {
      // CUHK Medicine: if M1/M2 beats the weakest of the 6 subjects, that subject's score becomes half its own + half M1/M2
      const worst = items.reduce((a, b) => (b.pts < a.pts ? b : a));
      if (mBest > worst.pts) { worst.pts = (worst.pts + mBest) / 2; worst.mhalf = true; }
    }
    let total = items.reduce((t, it) => t + it.pts * it.w, 0);
    let bonus = 0, bonusSub = null;
    if (p.bon) {
      let rest = pool.filter(x => !c.includes(x));
      if (p.xm && c.some(x => x.s === "MATH")) rest = rest.filter(x => !isM(x.s));
      for (const x of rest) {
        const pts = sc[x.g];
        let b = 0;
        if (p.bon.ust) b = pts * 0.05 * hiScore(p) / 8.5;
        else if (p.bon.wt) { if (pts >= 3) { const w0 = wOf(p.w, x.s); b = p.bon.f * pts * (w0 === undefined ? d : w0); } }
        else b = p.bon.f * pts;
        if (b > bonus) { bonus = b; bonusSub = x; }
      }
      total += bonus;
    }
    if (!best || total > best.score) best = { score: total, used: items, bonus, bonusSub };
  }
  if (!best) return { score: null, missing: ["組合不足"] };

  return best;
}

const _hi = new Map();
function hiScore(p) {
  if (_hi.has(p.c)) return _hi.get(p.c);
  const cand = ["ENG", "CHI", "MATH", "M1", "PHY", "CHEM", "BIO", "ICT", "ECON", "DAT"];
  const q = Object.assign({}, p, { bon: null });
  const r = evalFormula(q, cand.map(s => ({ s, g: "5**" })));
  const v = r.score || 0;
  _hi.set(p.c, v);
  return v;
}

// --- profile-based estimate (HKBU, LU): unweighted best 5 on 8.5 scale ---
function lvPts(v) {
  if (typeof v === "string" && SCALE.new[v] !== undefined) return SCALE.new[v];
  const x = parseFloat(v); const lo = Math.floor(x), hi = Math.ceil(x);
  const P = l => (l >= 5 ? 5.5 : l);
  return P(lo) + (P(hi) - P(lo)) * (x - lo);
}
function profScore(str) {
  const pts = str.split(" ").map(lvPts).sort((a, b) => b - a);
  return Math.round(pts.slice(0, 5).reduce((a, b) => a + b, 0) * 100) / 100;
}
function unweightedBest5(subs) {
  const pts = subs.filter(x => x.s !== "CSD" && x.g && x.g !== "U").map(x => SCALE.new[x.g]).sort((a, b) => b - a);
  return pts.slice(0, 5).reduce((a, b) => a + b, 0);
}

// --- general entrance requirements ---
function lv(g) { return g ? ({ "5**": 7, "5*": 6, "5": 5, "4": 4, "3": 3, "2": 2, "1": 1, "U": 0 })[g] : 0; }
function reqCheck(st) {
  // Same rules as the school's projected-grade sheet (electives include M1/M2; ApL not counted)
  const e = st.electives.filter(x => x.s && x.g && x.s !== "APL");
  const el = e.map(x => lv(x.g)).sort((a, b) => b - a);
  const mel = [lv(st.MATH), ...el].sort((a, b) => b - a);
  const c = lv(st.CHI), en = lv(st.ENG), m = lv(st.MATH), csd = st.CSD === "A";
  const core332A = c >= 3 && en >= 3 && m >= 2 && csd;
  const r = {
    ug: core332A && el[0] >= 3 && el[1] >= 3,                 // 332A33
    sf: core332A && el[0] >= 2 && el[1] >= 2,                 // 332A22
    a2: core332A && el[0] >= 2,                               // 332A2
    s1: en >= 2 && c >= 2 && csd && mel[0] >= 2 && mel[1] >= 2,               // 22+A22
    s2: en >= 2 && c >= 2 && mel[0] >= 2 && mel[1] >= 2 && mel[2] >= 2       // 22+222
  };
  r.ug1 = core332A && el[0] >= 3;
  r.sub = r.s1 || r.s2;
  r.none = !(r.ug || r.sf || r.a2 || r.s1 || r.s2);
  r.tier = r.ug ? "ug" : r.sf ? "sf" : r.a2 ? "a2" : r.sub ? "sub" : "none";
  return r;
}
function sheetStats(st) {
  const all = [st.ENG, st.CHI, st.MATH, ...st.electives.filter(x => x.s && x.g && x.s !== "APL").map(x => x.g)].filter(Boolean).map(lv).sort((a, b) => b - a);
  const sum = k => all.length >= k ? all.slice(0, k).reduce((a, b) => a + b, 0) : null;
  const n2 = all.filter(v => v >= 2).length + (st.CSD === "A" ? 1 : 0);
  return { b4: sum(4), b5: sum(5), b6: sum(6), n2 };
}
function progReq(p) {
  if (p.hd) return "sub";
  if (p.sf) return "sf";
  if (p.i === "CityU") return "ug1";
  return "ug";
}

function studentSubs(st) {
  const s = [];
  if (st.ENG) s.push({ s: "ENG", g: st.ENG });
  if (st.CHI) s.push({ s: "CHI", g: st.CHI });
  if (st.MATH) s.push({ s: "MATH", g: st.MATH });
  for (const e of st.electives) if (e.s && e.g) s.push({ s: e.s, g: e.g });
  if (st.CSD === "A") s.push({ s: "CSD", g: "A" });
  return s;
}

// main assess
function assess(p, st) {
  const subs = studentSubs(st);
  const rq = reqCheck(st);
  const reqKey = progReq(p);
  const out = { reqOK: rq[reqKey], reqKey };
  if (p.prof) {
    out.est = true;
    out.score = Math.round(unweightedBest5(subs) * 100) / 100;
    out.med = profScore(p.prof.m);
    out.lq = profScore(p.prof.l);

  } else {
    const r = evalFormula(p, subs);
    out.score = r.score; out.used = r.used; out.bonus = r.bonus; out.bonusSub = r.bonusSub; out.missing = r.missing;
    out.med = p.m; out.lq = p.l; out.uq = p.uq;
    if (p.avg != null) { out.avg = true; out.med = p.avg; out.lq = Math.round((p.avg - 1.5) * 100) / 100; }

  }
  if (out.score == null) out.safety = "inel";
  else if (out.med == null) out.safety = "nodata";
  else if (out.score >= Math.max(out.med, out.lq)) out.safety = "safe";
  else if (out.score >= Math.min(out.med, out.lq)) out.safety = "marginal";
  else out.safety = "risky";
  if (out.safety !== "inel" && !out.reqOK) out.warn = true;
  out.gap = out.score != null && out.lq != null ? out.score - out.lq : null;
  return out;
}

function formulaText(p) {
  if (p.prof) return "Best 5（以錄取生各科中位等級估算，未計比重）";
  const parts = [];
  const n = p.n || 5;
  const inc = p.inc || [];
  if (p.i === "PolyU" && inc.length === 2) parts.push(`Chi + Eng + Best 3`);
  else if (inc.length >= 3 && n === 5 && inc.includes("ENG") && inc.includes("CHI") && inc.includes("MATH") && p.i === "CityU") parts.push("3 core + 2 electives");
  else if (p.i === "THEi") parts.push("Chi + Eng + Math + CSD + 1 elective");
  else parts.push((inc.length ? inc.map(s => SHORT[s]).join(" + ") + ` + Best ${n - inc.length}` : `Best ${n}`));
  for (const g of p.one || []) parts.push(`須包括 ${g.k > 1 ? g.k + " 科 " : ""}${g.s.map(s => SHORT[s]).join("/")}`);
  if (p.i === "PolyU") {
    const ten = Object.entries(p.w).filter(([, v]) => v === 10).map(([k]) => SHORT[k] || k);
    parts.push(`比重 ×10: ${ten.join(", ")}；其餘 ×5 或 ×7`);
  } else if (p.w && Object.keys(p.w).length) {
    const by = {};
    for (const [k, v] of Object.entries(p.w)) (by[v] = by[v] || []).push(SHORT[k] || k);
    parts.push(Object.entries(by).sort((a, b) => b[0] - a[0]).map(([v, ks]) => `${ks.join("/")} ×${v}`).join(" · "));
  }
  for (const c of p.caps || []) {
    const by = {};
    for (const [k, v] of Object.entries(c.w)) (by[v] = by[v] || []).push(SHORT[k] || k);
    parts.push(`最佳 ${c.max} 科 ` + Object.entries(by).map(([v, ks]) => `${ks.join("/")} ×${v}`).join(" 或 "));
  }
  if (p.maxW) parts.push(`最多 ${p.maxW} 科計比重`);
  if (p.maxWE) parts.push(`最多 ${p.maxWE} 科選修計比重`);
  if (p.d && p.d !== 1 && p.i !== "PolyU") parts.push(`其他科 ×${p.d}`);
  if (p.bon) parts.push(p.bon.ust ? "第 6 科加分（最多 5%）" : p.bon.wt ? "第 6 科 (Lv3+) 加分 10%×比重" : `第 ${n + 1} 科 ×${p.bon.f}`);
  if (p.xm) parts.push("Math 與 M1/M2 只計一科");
  if (p.noM) parts.push("M1/M2 不作選修");
  if (p.csd2) parts.push("公民科達標當 Lv2 計");
  if (p.noApl) parts.push("只計甲類科目");
  if (p.sc === "old") parts.push("5**=7 計分");
  return parts.join(" · ");
}

    if (inel.length) tips.push(["hit", `${inel.join("、")} 可能未符合入學要求。`]);
    if (C.length < 20) tips.push(["", `尚有 ${20 - C.length} 個空位。`]);
    tips.push(["", "Band A 放「最想讀」，再按把握由高至低排；分數只係參考，面試、Band 次序同其他表現都會影響結果。"]);
  }
  const st = S.st;
  $("cside").innerHTML = `<h3>${esc(st.name || "我的志願")}${st.cls ? ` · ${esc(st.cls)}` : ""}${st.no ? ` (${esc(st.no)})` : ""}</h3>
    <div class="dist">${["safe", "marginal", "risky", "nodata"].map(k => `<div class="b-${k}"><b>${cnt[k]}</b>${SAFETY[k][0]}</div>`).join("")}</div>
    <ul class="tips">${tips.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join("")}</ul>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="copyList"${C.length ? "" : " disabled"}>複製志願表</button><button class="btn ghost" id="clearList"${C.length ? "" : " disabled"}>${confirmClear ? "再按一次確認清除" : "清除全部"}</button></div>
    <p style="margin:0;font-size:12.5px;color:var(--muted)">志願表同成績只儲存在你這部裝置的瀏覽器內。</p>`;
}
$("view-choices").addEventListener("toggle", e => { if (e.target.id === "guide") { S.gclosed = !e.target.open; save(); } }, true);
$("view-choices").addEventListener("click", e => {
  const up = e.target.closest("[data-up]"), dn = e.target.closest("[data-down]");
  if (up || dn) { const i = +(up ? up.dataset.up : dn.dataset.down), j = up ? i - 1 : i + 1; [S.choices[i], S.choices[j]] = [S.choices[j], S.choices[i]]; save(); renderChoices(); return; }
  if (e.target.id === "clearList") { if (!confirmClear) { confirmClear = true; renderChoices(); setTimeout(() => { confirmClear = false; if (S.view === "choices") renderChoices(); }, 4000); return; } S.choices = []; confirmClear = false; save(); renderPill(); renderChoices(); toast("已清除志願"); return; }
  if (e.target.id === "copyList") {
    const st = S.st;
    const lines = [`JUPAS 志願表 ${st.name || ""} ${st.cls || ""} ${st.no || ""}`.trim(), `成績：Eng ${st.ENG || "-"} Chi ${st.CHI || "-"} Math ${st.MATH || "-"} CSD ${st.CSD === "A" ? "A" : "-"} ` + st.electives.filter(x => x.s).map(x => `${SHORT[x.s]} ${x.g || "-"}`).join(" ")];
    S.eapp.forEach(c => lines.push(`E-APP：${BYCODE[c].i} ${BYCODE[c].t}`));
    S.choices.forEach((c, i) => { const b = BANDS.find(([, s, e]) => i >= s && i < e)[0]; const a = A[c]; lines.push(`${i + 1}. [Band ${b}] ${c} ${BYCODE[c].i} ${BYCODE[c].t} — ${SAFETY[a.safety][0]} (我的分數 ${fmt(a.score)}；LQ ${fmt(a.lq)}／中位數 ${fmt(a.med)})`); });
    const text = lines.join("\n");
    navigator.clipboard.writeText(text).then(() => toast("已複製，可以貼到 WhatsApp 或電郵")).catch(() => {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "width:100%;height:160px;margin-top:8px"; $("cside").appendChild(ta); ta.select(); toast("請手動複製下面的文字");
    });
  }
});

// ---------- about ----------
function renderAbout() {
  const n = PROGS.length;
  $("view-about").innerHTML = `<div class="card prose">
    <h2 class="section-h">分數點樣計？</h2>
    <p>每個課程用自己的計分公式：揀邊幾科、邊科要計、比重幾多都唔同。App 會試盡你所有科目組合，揀出該課程下最高的分數，再同 2025 年 JUPAS 主要輪次取錄生的分數比較。</p>
    <ul>
      <li><b>Safe</b>：你的分數 ≥ 2025 中位數。</li>
      <li><b>Marginal</b>：介乎 2025 下四分位數（LQ）與中位數之間。</li>
      <li><b>Risky</b>：低於 2025 下四分位數。</li>
      <li><b>No data</b>：新課程或院校未有公佈。<b>未符合</b>：缺少該課程必須計算的科目（例如 Bio/Chem）。</li>
    </ul>
    <h2 class="section-h">資料來源</h2>
    <p>收錄 ${n} 個課程，主要分數來自《2025 JUPAS Admissions Scores of 9 JUPAS Participating-institutions》，另加 SSSDP 院校及 CSPE 自資課程資料。2026 年度分數未公佈，所以只能參考上一年。</p>
    <ul>
      <li><b>HKU、CUHK</b>：2025 收生原則及比重，等級分 5**=8.5、5*=7、5=5.5（CUHK 醫科 JS4501／JS4502 用 5**=7）。</li>
      <li><b>CityU</b>：院校以 2026 公式重新計算的 2025 錄取分。</li>
      <li><b>HKUST</b>：用 HKUST 公佈的 2027 公式計分；工程學院用院校提供的 2026 模擬分。第 6 科加分按「最多 Best 5 滿分的 5%」比例估算。</li>
      <li><b>PolyU</b>：每科比重 5／7／10，取自 PolyU 2026/27 比重表；部分課程第 6 科 Lv3 或以上另加 10% × 等級分 × 比重。</li>
      <li><b>HKMU</b>：已更新為 HKMU 公佈的 <b>2026 年</b> JUPAS 收生中位數及 LQ（包括 SSSDP 的 JSSU 課程）；JS9555 未有 2026 數據，沿用 2025。</li>
      <li><b>SSSDP 院校</b>（聖方濟各、恒大、樹仁、東華、THEi、伍倫貢、珠海）：來自《2025 JUPAS Admissions Scores of SSSDP Institutions》，大多只公佈平均分（THEi 為 2024/25）。App 以「達平均分 = Safe、平均分以下 1.5 分內 = Marginal」估算。樹仁、東華、THEi 會把公民科「達標」當 Lv2 計。</li>
      <li><b>E-APP 非 JUPAS 課程</b>：樹仁及聖方濟各 2024/25 錄取平均分（自資專上教育委員會 CSPE 資料），包括聖方濟各 4 個高級文憑。</li>
      <li><b>EdUHK</b>：Best 5，等級分 5**=7、5*=6、5=5；EdUHK 部分課程採用其 2026 比重參考分。</li>
      <li><b>HKBU、嶺大</b>：只公佈錄取生的各科等級，App 用中位數及 LQ 學生的 Best 5（不計比重）估算，準確度較低。</li>
    </ul>

// ---------- views ----------
const VIEWS = ["choices", "explore", "routes", "about"];
function show(v) {
  if (!VIEWS.includes(v)) v = "explore";
  S.view = v;
  for (const x of VIEWS) { $("view-" + x).hidden = x !== v; $("tab-" + x).setAttribute("aria-selected", x === v); }
  const VT = { choices: ["My Choices", "我的志願"], explore: ["Explore Programmes", "搜尋課程"], routes: ["Other Routes", "E-APP 及其他出路"], about: ["How Scores Work", "計分說明"] }[v];
  $("vtitle").textContent = VT[0]; $("crumb").textContent = VT[1];
  if (v === "explore") renderList();
  if (v === "choices") renderChoices();
  if (v === "routes") renderRoutes();
  if (v === "about") renderAbout();
  save();
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) show(b.dataset.view); });
function update() { recompute(); renderSummary(); renderPill(); show(S.view); save(); }

renderFields(); renderFilters();
const h = (location.hash || "").slice(1);
if (VIEWS.includes(h)) S.view = h;
update();

</script>
